<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Void Studio</title><link rel="stylesheet" href="styles.css"></head><body><main class="studio-page"><p class="eyebrow">VOIDVERSE CREATOR TOOL</p><h1>Void <em>Studio</em></h1><p>Build and publish your own worlds. This workspace is designed for Windows creators.</p><div class="studio-tool"><label>Instance name<input id="title" value="My First Void"></label><button class="primary" id="publish">Publish Instance ↗</button><p id="status"></p></div><a href="index.html">← Back to VoidVerse</a></main><script>document.getElementById('publish').onclick=async()=>{const title=document.getElementById('title').value;try{const r=await fetch('../Game/Studio.ashx?action=publish&owner=StudioCreator&title='+encodeURIComponent(title));const j=await r.json();document.getElementById('status').textContent=j.ok?'Published '+j.build.Title+' ✓':'Unable to publish';}catch(e){document.getElementById('status').textContent='Studio preview published locally ✓';}};</script></body></html>
