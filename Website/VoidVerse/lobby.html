<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoidVerse Lobbies</title>
  <style>
    :root {
      --bg: #0b1020;
      --bg-2: #171f32;
      --panel: rgba(17, 24, 39, 0.78);
      --panel-strong: rgba(12, 16, 26, 0.96);
      --border: rgba(148, 163, 184, 0.25);
      --text: #edf2ff;
      --muted: #b3bed9;
      --primary: #7c94ff;
      --primary-2: #8df4ff;
      --gold: #ffc857;
      --success: #7be0a4;
      --danger: #ff7a90;
      --shadow: 0 20px 50px rgba(10, 13, 20, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: linear-gradient(135deg, #090d18 0%, #111a2d 40%, #1a2440 100%);
      color: var(--text);
      font-family: Inter, Segoe UI, sans-serif;
    }

    .shell {
      width: min(1280px, calc(100% - 32px));
      margin: 32px auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-decoration: none;
      color: var(--text);
    }

    .brand-mark {
      background: linear-gradient(135deg, var(--primary-2), var(--primary));
      color: #09111b;
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      box-shadow: 0 8px 22px rgba(125, 156, 255, 0.45);
    }

    .nav-links {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.92rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 340px 1fr 320px;
      gap: 24px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-inner {
      padding: 20px;
    }

    h2, h3, p { margin-top: 0; }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--primary-2);
      font-weight: 700;
      font-size: 0.72rem;
      margin-bottom: 10px;
    }

    .room-list, .chat-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 18px;
    }

    .room-card, .chat-message, .member-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .room-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .room-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }

    .badge {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--bg);
      background: linear-gradient(135deg, var(--gold), #ffe5a8);
    }

    .badge.public { background: linear-gradient(135deg, var(--success), #b8f7d7); }
    .badge.private { background: linear-gradient(135deg, #facc15, #fde68a); }
    .badge.friends { background: linear-gradient(135deg, #a5b4fc, #c7d2fe); }

    .room-card strong, .member-card strong {
      font-size: 1rem;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .primary-btn, .secondary-btn, .ghost-btn {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .primary-btn:hover, .secondary-btn:hover, .ghost-btn:hover { transform: translateY(-1px); }

    .primary-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #061018;
    }

    .secondary-btn {
      background: rgba(124, 148, 255, 0.18);
      border: 1px solid rgba(150, 175, 255, 0.3);
      color: var(--text);
    }

    .ghost-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .hero {
      background: linear-gradient(135deg, rgba(124, 148, 255, 0.22), rgba(141, 244, 255, 0.15));
      border-radius: 20px;
      border: 1px solid var(--border);
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: var(--shadow);
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 3vw, 3rem);
      letter-spacing: -0.05em;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      max-width: 680px;
      line-height: 1.6;
    }

    .hero-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .field input, .field select, .field textarea {
      background: rgba(7, 12, 21, 0.9);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      padding: 11px 12px;
      font: inherit;
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .chat-message {
      color: var(--muted);
      line-height: 1.5;
    }

    .member-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }

    .member-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .presence {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .presence-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      background: var(--success);
      box-shadow: 0 0 12px rgba(123, 224, 164, 0.76);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 8px;
      border-radius: 999px;
      font-size: 0.68rem;
      border: 1px solid rgba(123, 224, 164, 0.25);
      color: var(--success);
      background: rgba(123, 224, 164, 0.08);
    }

    .empty {
      color: var(--muted);
      opacity: 0.8;
      font-size: 0.9rem;
    }

    @media (max-width: 1100px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .content-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="index.html"><span class="brand-mark">✦</span>VOIDVERSE</a>
      <nav class="nav-links">
        <a href="creator-dashboard.html">Creator Hub</a>
        <a href="account-settings.html">Account</a>
        <a href="index.html">Home</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <div class="eyebrow">Multiplayer hub</div>
        <h1>Jump into a live VoidVerse lobby.</h1>
        <p>Browse active rooms, create your own session, and connect with players in real time across social, racing, combat, and co-op experiences.</p>
        <div class="hero-actions">
          <button class="primary-btn" id="quickJoin">Quick join</button>
          <button class="secondary-btn" id="hostLobby">Host a lobby</button>
        </div>
      </section>

      <div class="layout">
        <aside class="panel">
          <div class="panel-inner">
            <div class="eyebrow">Active rooms</div>
            <div id="roomList" class="room-list"></div>
          </div>
        </aside>

        <section>
          <div class="content-grid">
            <div class="panel">
              <div class="panel-inner">
                <div class="eyebrow">Host a room</div>
                <div class="field">
                  <label for="roomName">Room name</label>
                  <input id="roomName" type="text" value="Skyforge Arena" />
                </div>
                <div class="field">
                  <label for="roomType">Mode</label>
                  <select id="roomType">
                    <option value="public">Public</option>
                    <option value="friends">Friends</option>
                    <option value="private">Private</option>
                  </select>
                </div>
                <div class="field">
                  <label for="roomGoal">Objective</label>
                  <textarea id="roomGoal">Conquer the arena and push for the highest score before the timer expires.</textarea>
                </div>
                <button class="primary-btn" id="createRoomBtn">Create room</button>
              </div>
            </div>

            <div class="panel">
              <div class="panel-inner">
                <div class="eyebrow">Live chat</div>
                <div id="chatList" class="chat-list"></div>
              </div>
            </div>
          </div>
        </section>

        <aside class="panel">
          <div class="panel-inner">
            <div class="eyebrow">Players online</div>
            <div id="memberList" class="member-list"></div>
          </div>
        </aside>
      </div>
    </main>
  </div>

  <script src="lobby.js"></script>
</body>
</html>
